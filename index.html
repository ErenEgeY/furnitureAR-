<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Mobilya AR Kataloğu</title>

    <!-- Google Model Viewer Kütüphanesi -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"
    ></script>

    <!-- Harici Stil Dosyası (Önbellek kilidini kıran versiyonlu) -->
    <link rel="stylesheet" href="style.css?v=3" />

    <!-- Hızlı Ağ Bağlantıları -->
    <link rel="preconnect" href="https://ajax.googleapis.com" />
  </head>
  <body>
    <header>
      <div class="brand-tag">3D STUDIO & AR PROVA</div>
      <h1>Özel Tasarım Mobilya</h1>
    </header>

    <main class="main-container">
      <div class="viewer-wrapper">
        <!-- Akıcı Üst Yükleme Çizgisi -->
        <div id="loader-line" class="loader-line"></div>

        <!-- Sağ Üst Donanımsal AR Butonu -->
        <button
          type="button"
          id="ar-launch-button"
          onclick="startAR()"
          title="Mekanda Gör"
        >
          <svg viewBox="0 0 24 24" class="ar-icon">
            <path
              d="M4 4h3V2H4a2 2 0 0 0-2 2v3h2V4zm16-2h-3v2h3v3h2V4a2 2 0 0 0-2-2zm-1 18h-3v2h3a2 2 0 0 0 2-2v-3h-2v3zM4 17H2v3a2 2 0 0 0 2 2h3v-2H4v-3zm8-9a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"
            />
          </svg>
          <span>AR'da Gör</span>
        </button>

        <!-- Sol Alt Cam Efektli Mod Seçici (Dolu / X-Ray) -->
        <div class="view-mode-pill">
          <button
            type="button"
            class="mode-opt active"
            id="mode-solid"
            onclick="setGhostMode(false)"
          >
            Dolu
          </button>
          <button
            type="button"
            class="mode-opt"
            id="mode-ghost"
            onclick="setGhostMode(true)"
          >
            X-Ray
          </button>
        </div>

        <!-- Genişletilmiş 3D Sahne -->
        <model-viewer
          id="ar-viewer"
          src="models/koltuk.glb"
          ios-src="models/koltuk.usdz"
          alt="Mobilya 3D Modeli"
          ar
          ar-modes="quick-look scene-viewer webxr"
          ar-scale="auto"
          ar-placement="floor"
          camera-controls
          interaction-prompt="none"
          camera-orbit="0deg 75deg 105%"
          field-of-view="32deg"
          touch-action="pan-y"
          shadow-intensity="0.8"
          shadow-softness="0.5"
          exposure="1.1"
          loading="eager"
          reveal="auto"
        >
        </model-viewer>
      </div>

      <!-- Alt Kontrol Paneli -->
      <section class="controls-card">
        <nav class="product-tabs">
          <button class="tab-btn active" onclick="selectProduct('koltuk')">
            Berjer
          </button>
          <button class="tab-btn" onclick="selectProduct('koltukT')">
            Koltuk T.
          </button>
          <button class="tab-btn" onclick="selectProduct('lamba')">
            Lamba
          </button>
          <button class="tab-btn" onclick="selectProduct('masa')">Masa</button>
        </nav>

        <article class="product-info">
          <div class="info-header">
            <h2 id="product-title">Tekli Berjer Koltuk</h2>
            <span class="dimensions-pill" id="product-dimensions"
              >85 × 90 × 95 cm</span
            >
          </div>
          <p class="description" id="product-desc">
            Odanızda kaplayacağı alanı birebir görmek için sağ üstteki AR
            butonuna dokunun. Sol alttaki X-Ray modu ile iskelet sınırlarını
            inceleyebilirsiniz.
          </p>
        </article>
      </section>
    </main>

    <script>
      const products = {
        koltuk: {
          title: "Tekli Berjer Koltuk",
          dimensions: "85 × 90 × 95 cm",
          desc: "Zemine oturtup parmağınızla odada istediğiniz köşeye serbestçe sürükleyebilirsiniz.",
          glb: "models/koltuk.glb",
          usdz: "models/koltuk.usdz",
          cameraOrbit: "0deg 75deg 105%",
        },
        koltukT: {
          title: "Modüler Koltuk Takımı",
          dimensions: "230 × 95 × 85 cm",
          desc: "Geniş salonlar için 1:1 ölçekli model. X-Ray moduyla arkasındaki alanı görebilirsiniz.",
          glb: "models/koltukT.glb",
          usdz: "models/koltukT.usdz",
          cameraOrbit: "25deg 70deg 110%",
        },
        lamba: {
          title: "Modern Lamba",
          dimensions: "40 × 40 × 120 cm",
          desc: "Köşe aydınlatması için optimize edilmiş zemin yerleşimi.",
          glb: "models/lamba.glb",
          usdz: "models/lamba.usdz",
          cameraOrbit: "0deg 80deg 115%",
        },
        masa: {
          title: "Masif Yemek Masası",
          dimensions: "160 × 90 × 76 cm",
          desc: "Zemine oturtup etrafında yürüyerek geçiş paylarını test edebilirsiniz.",
          glb: "models/masa.glb",
          usdz: "models/masa.usdz",
          cameraOrbit: "35deg 65deg 108%",
        },
      };

      let currentProduct = "koltuk";
      let isGhostActive = false;
      const viewer = document.getElementById("ar-viewer");
      const loaderLine = document.getElementById("loader-line");

      // Yükleme Çizgisi Takibi
      viewer.addEventListener("progress", (e) => {
        const progress = e.detail.totalProgress;
        loaderLine.style.opacity = "1";
        loaderLine.style.width = progress * 100 + "%";
      });

      viewer.addEventListener("load", () => {
        loaderLine.style.width = "100%";
        setTimeout(() => {
          loaderLine.style.opacity = "0";
          loaderLine.style.width = "0%";
        }, 200);

        if (isGhostActive) applyGhostMode(true);
      });

      // Saydam / X-Ray Modu
      function setGhostMode(enable) {
        isGhostActive = enable;
        applyGhostMode(enable);

        document
          .getElementById("mode-solid")
          .classList.toggle("active", !enable);
        document
          .getElementById("mode-ghost")
          .classList.toggle("active", enable);
      }

      function applyGhostMode(enable) {
        if (!viewer.model || !viewer.model.materials) return;

        viewer.model.materials.forEach((mat) => {
          if (enable) {
            mat.pbrMetallicRoughness.setBaseColorFactor([0.9, 0.9, 0.95, 0.35]);
            if (mat.setAlphaMode) mat.setAlphaMode("BLEND");
          } else {
            mat.pbrMetallicRoughness.setBaseColorFactor([1.0, 1.0, 1.0, 1.0]);
            if (mat.setAlphaMode) mat.setAlphaMode("OPAQUE");
          }
        });
      }

      // Ürün Değiştirme
      function selectProduct(key) {
        if (key === currentProduct) return;
        currentProduct = key;
        const item = products[key];

        loaderLine.style.opacity = "1";
        loaderLine.style.width = "25%";

        viewer.src = item.glb;
        if (item.usdz) {
          viewer.setAttribute("ios-src", item.usdz);
        } else {
          viewer.removeAttribute("ios-src");
        }

        if (item.cameraOrbit) {
          viewer.cameraOrbit = item.cameraOrbit;
        }

        document.getElementById("product-title").innerText = item.title;
        document.getElementById("product-dimensions").innerText =
          item.dimensions;
        document.getElementById("product-desc").innerText = item.desc;

        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
      }

      // Donanımsal Hızlı AR Başlatıcı
      function startAR() {
        if (typeof viewer.activateAR === "function") {
          viewer.activateAR();
        } else {
          alert(
            "AR desteği bu cihazda aktif değil veya model henüz indiriliyor.",
          );
        }
      }
    </script>
  </body>
</html>
