<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Mobilya AR Kataloğu</title>

    <!-- Google Model Viewer -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"
    ></script>

    <!-- Harici CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="badge">Artırılmış Gerçeklik</div>
      <h1>Mobilya Stüdyosu</h1>
      <p>Modeli inceleyin veya kamerayla mekanınıza yerleştirin.</p>
    </header>

    <div class="main-container">
      <div class="viewer-wrapper">
        <model-viewer
          id="ar-viewer"
          src="models/koltuk.glb"
          ios-src="models/koltuk.usdz"
          alt="Mobilya Modeli"
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-scale="auto"
          ar-placement="floor"
          camera-controls
          touch-action="pan-y"
          shadow-intensity="1.4"
          shadow-softness="1"
          exposure="1.05"
          auto-rotate
        >
        </model-viewer>

        <!-- Sağ Altta Kompakt Kamera Butonu -->
        <button
          type="button"
          id="custom-ar-button"
          onclick="startAR()"
          title="Kamerada Gör"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M12 9a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5zm0 6a2.25 2.25 0 1 1 0-4.5 2.25 2.25 0 0 1 0 4.5z"
            />
            <path
              d="M9 3L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9zm11 16H4V7h3.83l1.83-2h4.68l1.83 2H20v12z"
            />
          </svg>
        </button>
      </div>

      <div class="controls-card">
        <div class="product-tabs">
          <button class="tab-btn active" onclick="selectProduct('koltuk')">
            Koltuk
          </button>
          <button class="tab-btn" onclick="selectProduct('lamba')">
            Lamba
          </button>
          <button class="tab-btn" onclick="selectProduct('masa')">Masa</button>
        </div>

        <div class="product-info">
          <h2 id="product-title">Tekli Berjer Koltuk</h2>
          <div class="dimensions-pill" id="product-dimensions">
            85 × 90 × 95 cm
          </div>
          <p class="description" id="product-desc">
            Odanızda görmek için kamera butonuna dokunun. Tek parmağınızla tutup
            sürükleyebilir, iki parmakla boyutlandırabilirsiniz.
          </p>
        </div>
      </div>
    </div>

    <script>
      const products = {
        koltuk: {
          title: "Tekli Berjer Koltuk",
          dimensions: "85 × 90 × 95 cm",
          desc: "Zemine oturtup parmağınızla odada istediğiniz köşeye sürükleyebilirsiniz.",
          glb: "models/koltuk.glb",
          usdz: "models/koltuk.usdz",
          placement: "floor",
          cameraTarget: "auto auto auto",
        },
        lamba: {
          title: "Modern Tavan / Duvar Lambası",
          dimensions: "40 × 40 × 120 cm",
          desc: "Kamerayı hedef yüzeye tutun. Yerleştikten sonra parmağınızla yüzey üzerinde serbestçe sürükleyebilirsiniz.",
          glb: "models/lamba.glb",
          usdz: "models/lamba.usdz",
          placement: "wall",
          cameraTarget: "0m 0m 0m",
        },
        masa: {
          title: "Masif Yemek Masası",
          dimensions: "160 × 90 × 76 cm",
          desc: "Zemine oturtup sürükleyebilir, etrafında yürüyerek ölçülerini test edebilirsiniz.",
          glb: "models/masa.glb",
          usdz: "models/masa.usdz",
          placement: "floor",
          cameraTarget: "auto auto auto",
        },
      };

      let currentProduct = "koltuk";

      function selectProduct(key) {
        currentProduct = key;
        const viewer = document.getElementById("ar-viewer");
        const item = products[key];

        viewer.src = item.glb;
        if (item.usdz) {
          viewer.setAttribute("ios-src", item.usdz);
        } else {
          viewer.removeAttribute("ios-src");
        }

        viewer.setAttribute("ar-placement", item.placement);

        if (item.cameraTarget) {
          viewer.setAttribute("camera-target", item.cameraTarget);
        }

        document.getElementById("product-title").innerText = item.title;
        document.getElementById("product-dimensions").innerText =
          item.dimensions;
        document.getElementById("product-desc").innerText = item.desc;

        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
      }

      function startAR() {
        const viewer = document.getElementById("ar-viewer");
        const item = products[currentProduct];
        const isIOS =
          (/iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" &&
              navigator.maxTouchPoints > 1)) &&
          !window.MSStream;

        if (viewer.canActivateAR) {
          viewer.activateAR();
          return;
        }

        // iOS Quick Look (Quick Look linkine serbest sürükleme ve izinleri verir)
        if (isIOS && item.usdz) {
          const fullUsdzUrl = new URL(item.usdz, window.location.href).href;
          const anchor = document.createElement("a");
          anchor.setAttribute("rel", "ar");
          anchor.appendChild(document.createElement("img"));
          // allowsContentScaling ve serbest gesture bayrakları
          anchor.setAttribute("href", `${fullUsdzUrl}#allowsContentScaling=1`);
          anchor.click();
          return;
        }

        // Android Scene Viewer (plane_type ve serbest sürükleme parametreleri)
        if (/android/i.test(navigator.userAgent)) {
          const fullGlbUrl = new URL(item.glb, window.location.href).href;
          const intentPlacement = item.placement === "wall" ? "wall" : "floor";
          const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(fullGlbUrl)}&mode=ar_only&plane_type=${intentPlacement}&enable_horizontal_drag=true#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;end;`;
          window.location.href = intentUrl;
          return;
        }

        alert(
          "AR deneyimi mobil cihazlar içindir. Lütfen telefonunuzdan açın!",
        );
      }
    </script>
  </body>
</html>
