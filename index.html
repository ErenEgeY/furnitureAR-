<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Mobilya AR Kataloğu</title>

    <!-- Google Model Viewer -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"
    ></script>

    <!-- Harici CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="badge">Artırılmış Gerçeklik</div>
      <h1>Mobilya Stüdyosu</h1>
      <p>Modeli çevirin veya kameranızı açıp odanıza yerleştirin.</p>
    </header>

    <div class="main-container">
      <div class="viewer-wrapper">
        <model-viewer
          id="ar-viewer"
          src="models/koltuk.glb"
          ios-src="models/koltuk.usdz"
          alt="Mobilya Modeli"
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-scale="fixed"
          ar-placement="floor"
          camera-controls
          touch-action="pan-y"
          shadow-intensity="1.6"
          shadow-softness="1"
          exposure="1.05"
          auto-rotate
        >
        </model-viewer>

        <!-- Her Zaman Görünür AR / Kamera Butonu -->
        <button type="button" id="custom-ar-button" onclick="startAR()">
          <svg viewBox="0 0 24 24">
            <path
              d="M4 4h3V2H4a2 2 0 0 0-2 2v3h2V4zm16-2h-3v2h3v3h2V4a2 2 0 0 0-2-2zm-1 18h-3v2h3a2 2 0 0 0 2-2v-3h-2v3zM4 17H2v3a2 2 0 0 0 2 2h3v-2H4v-3zm8-9a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"
            />
          </svg>
          Gerçekte Gör (Kamerayı Aç)
        </button>
      </div>

      <div class="controls-card">
        <div class="product-tabs">
          <button class="tab-btn active" onclick="selectProduct('koltuk')">
            Koltuk
          </button>
          <button class="tab-btn" onclick="selectProduct('lamba')">
            Lamba
          </button>
          <button class="tab-btn" onclick="selectProduct('masa')">Masa</button>
        </div>

        <div class="product-info">
          <h2 id="product-title">Tekli Berjer Koltuk</h2>
          <div class="dimensions-pill" id="product-dimensions">
            85 × 90 × 95 cm
          </div>
          <p class="description" id="product-desc">
            Odanızda kaplayacağı alanı birebir görmek için butona dokunup
            kameranızı zemine yöneltin.
          </p>
        </div>
      </div>
    </div>

    <script>
      const products = {
        koltuk: {
          title: "Tekli Berjer Koltuk",
          dimensions: "85 × 90 × 95 cm",
          desc: "Odanızda kaplayacağı alanı birebir görmek için butona dokunup kameranızı zemine yöneltin.",
          glb: "models/koltuk.glb",
          usdz: "models/koltuk.usdz",
          placement: "floor", // Zemin algılama
          cameraTarget: "auto auto auto",
        },
        lamba: {
          title: "Modern Tavan / Sarkıt Lamba",
          dimensions: "40 × 40 × 120 cm",
          desc: "Tavana veya yukarı yüzeye yapışması için kameranızı yukarı/üst alana yöneltin.",
          glb: "models/lamba.glb",
          usdz: "models/lamba.usdz",
          placement: "wall", // Üst/dikey yüzey algılama
          cameraTarget: "auto 100% auto", // Üst tepe noktasından hizalama
        },
        masa: {
          title: "Masif Yemek Masası",
          dimensions: "160 × 90 × 76 cm",
          desc: "Salon veya yemek odanıza tam uyup uymadığını gerçek boyutlarıyla zeminde test edin.",
          glb: "models/masa.glb",
          usdz: "models/masa.usdz",
          placement: "floor", // Zemin algılama
          cameraTarget: "auto auto auto",
        },
      };

      let currentProduct = "koltuk";

      function selectProduct(key) {
        currentProduct = key;
        const viewer = document.getElementById("ar-viewer");
        const item = products[key];

        // Model kaynakları
        viewer.src = item.glb;
        if (item.usdz) {
          viewer.setAttribute("ios-src", item.usdz);
        } else {
          viewer.removeAttribute("ios-src");
        }

        // AR Zemin / Tavan Yüzey Yerleşimi Ayarı
        viewer.setAttribute("ar-placement", item.placement);

        // Model odak ve hizalama noktası ayarı (lambada üst kısımdan yapışma için)
        if (item.cameraTarget) {
          viewer.setAttribute("camera-target", item.cameraTarget);
        }

        // Bilgileri güncelle
        document.getElementById("product-title").innerText = item.title;
        document.getElementById("product-dimensions").innerText =
          item.dimensions;
        document.getElementById("product-desc").innerText = item.desc;

        // Sekme aktifliğini güncelle
        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
      }

      // Kamera ve AR'ı başlatan tetikleyici
      function startAR() {
        const viewer = document.getElementById("ar-viewer");
        const item = products[currentProduct];
        const isIOS =
          (/iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" &&
              navigator.maxTouchPoints > 1)) &&
          !window.MSStream;

        // 1. Model-viewer native AR
        if (viewer.canActivateAR) {
          viewer.activateAR();
          return;
        }

        // 2. iOS Quick Look Fallback
        if (isIOS && item.usdz) {
          const fullUsdzUrl = new URL(item.usdz, window.location.href).href;
          const anchor = document.createElement("a");
          anchor.setAttribute("rel", "ar");
          anchor.appendChild(document.createElement("img"));
          anchor.setAttribute("href", fullUsdzUrl);
          anchor.click();
          return;
        }

        // 3. Android Scene Viewer Fallback
        if (/android/i.test(navigator.userAgent)) {
          const fullGlbUrl = new URL(item.glb, window.location.href).href;
          // placement parametresini intent linkine de dinamik ekliyoruz
          const intentPlacement = item.placement === "wall" ? "wall" : "floor";
          const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(fullGlbUrl)}&mode=ar_only&resizable=false&plane_type=${intentPlacement}#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;end;`;
          window.location.href = intentUrl;
          return;
        }

        alert(
          "AR kamera deneyimi mobil cihazlar (iOS ve Android) içindir. Lütfen telefonunuzdan açın!",
        );
      }
    </script>
  </body>
</html>
