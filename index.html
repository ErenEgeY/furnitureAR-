<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Mobilya AR Kataloğu</title>

    <!-- Google Model Viewer -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"
    ></script>

    <!-- Harici CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="badge">Artırılmış Gerçeklik</div>
      <h1>Mobilya Stüdyosu</h1>
      <p>Modeli inceleyin veya kamerayla mekanınıza yerleştirin.</p>
    </header>

    <main class="main-container">
      <div class="viewer-wrapper">
        <!-- İnce, Akıcı Üst Yükleme Çizgisi (Ekranı Kilitlemez) -->
        <div id="loader-line" class="loader-line"></div>

        <!-- Sağ Üstte Minimal AR Butonu -->
        <button
          type="button"
          id="ar-launch-button"
          onclick="startAR()"
          title="Mekanda Gör"
        >
          <svg viewBox="0 0 24 24" class="ar-icon">
            <path
              d="M4 4h3V2H4a2 2 0 0 0-2 2v3h2V4zm16-2h-3v2h3v3h2V4a2 2 0 0 0-2-2zm-1 18h-3v2h3a2 2 0 0 0 2-2v-3h-2v3zM4 17H2v3a2 2 0 0 0 2 2h3v-2H4v-3zm8-9a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"
            />
          </svg>
          <span class="ar-label">AR'da Gör</span>
        </button>

        <!-- 3D Model Sahnesi -->
        <model-viewer
          id="ar-viewer"
          src="models/koltuk.glb"
          ios-src="models/koltuk.usdz"
          alt="Mobilya 3D Modeli"
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-scale="auto"
          ar-placement="floor"
          camera-controls
          touch-action="pan-y"
          shadow-intensity="0.8"
          shadow-softness="0.4"
          exposure="1"
          loading="eager"
          reveal="auto"
        >
        </model-viewer>
      </div>

      <!-- Ürün Kontrol Paneli -->
      <section class="controls-card">
        <nav class="product-tabs">
          <button class="tab-btn active" onclick="selectProduct('koltuk')">
            Berjer
          </button>
          <button class="tab-btn" onclick="selectProduct('koltukT')">
            Koltuk T.
          </button>
          <button class="tab-btn" onclick="selectProduct('lamba')">
            Lamba
          </button>
          <button class="tab-btn" onclick="selectProduct('masa')">Masa</button>
        </nav>

        <article class="product-info">
          <h2 id="product-title">Tekli Berjer Koltuk</h2>
          <div class="dimensions-pill" id="product-dimensions">
            85 × 90 × 95 cm
          </div>
          <p class="description" id="product-desc">
            Odanızda kaplayacağı alanı görmek için sağ üstteki AR butonuna
            dokunun. Tek parmağınızla serbestçe sürükleyip taşıyabilirsiniz.
          </p>
        </article>
      </section>
    </main>

    <script>
      const products = {
        koltuk: {
          title: "Tekli Berjer Koltuk",
          dimensions: "85 × 90 × 95 cm",
          desc: "Zemine oturtup parmağınızla odada istediğiniz köşeye sürükleyebilirsiniz.",
          glb: "models/koltuk.glb",
          usdz: "models/koltuk.usdz",
        },
        koltukT: {
          title: "Modüler Koltuk Takımı",
          dimensions: "230 × 95 × 85 cm",
          desc: "Salonunuzun zeminine tam oturur. Kaplayacağı gerçek hacmi ve yürüyüş payını test edin.",
          glb: "models/koltukT.glb",
          usdz: "models/koltukT.usdz",
        },
        lamba: {
          title: "Modern Lamba",
          dimensions: "40 × 40 × 120 cm",
          desc: "Doğru dik açısıyla yerleşir. Tek parmağınızla tutup odanın her yerine rahatça sürükleyebilirsiniz.",
          glb: "models/lamba.glb",
          usdz: "models/lamba.usdz",
        },
        masa: {
          title: "Masif Yemek Masası",
          dimensions: "160 × 90 × 76 cm",
          desc: "Zemine oturtup sürükleyebilir, etrafında yürüyerek ölçülerini test edebilirsiniz.",
          glb: "models/masa.glb",
          usdz: "models/masa.usdz",
        },
      };

      let currentProduct = "koltuk";
      const viewer = document.getElementById("ar-viewer");
      const loaderLine = document.getElementById("loader-line");

      // Model Yükleme İlerlemesi (Yalnızca üstteki ince çizgiyi yönetir, dokunmayı ASLA engellemez)
      viewer.addEventListener("progress", (e) => {
        const progress = e.detail.totalProgress;
        loaderLine.style.opacity = "1";
        loaderLine.style.width = progress * 100 + "%";
      });

      viewer.addEventListener("load", () => {
        loaderLine.style.width = "100%";
        setTimeout(() => {
          loaderLine.style.opacity = "0";
          loaderLine.style.width = "0%";
        }, 250);
      });

      function selectProduct(key) {
        if (key === currentProduct) return;
        currentProduct = key;
        const item = products[key];

        // Yeni modeli ata (model viewer eskiyi gösterirken yeniyi arka planda indirir)
        loaderLine.style.opacity = "1";
        loaderLine.style.width = "20%";

        viewer.src = item.glb;
        if (item.usdz) {
          viewer.setAttribute("ios-src", item.usdz);
        } else {
          viewer.removeAttribute("ios-src");
        }

        // UI metinlerini hemen güncelle
        document.getElementById("product-title").innerText = item.title;
        document.getElementById("product-dimensions").innerText =
          item.dimensions;
        document.getElementById("product-desc").innerText = item.desc;

        // Sekme aktifliğini anında güncelle
        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
      }

      function startAR() {
        const item = products[currentProduct];
        const isIOS =
          (/iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" &&
              navigator.maxTouchPoints > 1)) &&
          !window.MSStream;

        if (viewer.canActivateAR) {
          viewer.activateAR();
          return;
        }

        if (isIOS && item.usdz) {
          const fullUsdzUrl = new URL(item.usdz, window.location.href).href;
          const anchor = document.createElement("a");
          anchor.setAttribute("rel", "ar");
          anchor.appendChild(document.createElement("img"));
          anchor.setAttribute("href", `${fullUsdzUrl}#allowsContentScaling=1`);
          anchor.click();
          return;
        }

        if (/android/i.test(navigator.userAgent)) {
          const fullGlbUrl = new URL(item.glb, window.location.href).href;
          const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(fullGlbUrl)}&mode=ar_only&plane_type=floor&enable_horizontal_drag=true#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;end;`;
          window.location.href = intentUrl;
          return;
        }

        alert(
          "AR deneyimi mobil cihazlar içindir. Lütfen telefonunuzdan açın!",
        );
      }
    </script>
  </body>
</html>
